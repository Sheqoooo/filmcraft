name: macOS ARM64 developer app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish this build as a downloadable development prerelease"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'Sheqoooo/filmcraft'
    permissions:
      contents: write # Required for the explicitly requested development prerelease below.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select pinned native toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.95.0 --profile minimal
          rustup override set 1.95.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-rust-1.95-dev-app-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-${{ github.sha }}
          restore-keys: |
            macos-arm64-rust-1.95-dev-app-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}-
            macos-arm64-rust-1.95-dev-app-
      - name: Build and verify developer app
        run: bash packaging/macos/dev/build.sh
      - name: Archive app preserving executable permissions and signatures
        run: |
          ditto -c -k --sequesterRsrc --keepParent "FilmCraft Dev.app" dist/dev/FilmCraft-Dev-macos-arm64.zip
          cd dist/dev
          shasum -a 256 FilmCraft-Dev-macos-arm64.zip > FilmCraft-Dev-macos-arm64.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FilmCraft-Dev-macos-arm64-${{ github.sha }}
          path: |
            dist/dev/FilmCraft-Dev-macos-arm64.zip
            dist/dev/FilmCraft-Dev-macos-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Publish requested development prerelease
        if: inputs.publish_release == true || startsWith(github.event.head_commit.message, 'DEV.RELEASE:')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="dev-${GITHUB_SHA:0:12}"
          cd dist/dev
          shasum -a 256 -c FilmCraft-Dev-macos-arm64.zip.sha256
          cat > release-notes.md <<NOTES
          Development snapshot of the independent Sheqoooo/filmcraft fork, including our timeline, monitor and EffectCraft changes.

          ## Download and install
          - Download **FilmCraft-Dev-macos-arm64.zip** below and extract it.
          - Move **FilmCraft Dev.app** to Applications and open it.
          - Requires an **Apple Silicon Mac (M1 or newer)**. This download does not support Intel Macs or Windows.
          - The app is ad-hoc signed, without Apple notarization. If macOS blocks it, allow this app in **System Settings → Privacy & Security**, then open it again.
          - No Rust installation, source checkout or terminal commands are needed.
          - The EffectCraft command-line helper is bundled; its graphical editor must be installed separately to use that integration.

          ## Development status and validation
          This is an experimental development build, not a stable release. Save projects before trying it. It uses separate FilmCraft Dev settings and recovery data.

          The workflow compiled the ARM64 app, verified its bundle signature and version command, and generated the SHA-256 checksum attached below. A complete workspace test suite and an interactive GUI acceptance run are not part of this workflow; previously documented export/wasm limitations remain.

          Source commit: ${GITHUB_SHA}
          Build: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          NOTES
          gh release create "$TAG" \
            FilmCraft-Dev-macos-arm64.zip FilmCraft-Dev-macos-arm64.zip.sha256 \
            --target "$GITHUB_SHA" --title "FilmCraft Dev · ${GITHUB_SHA:0:12} · macOS Apple Silicon" \
            --notes-file release-notes.md --prerelease --latest=false --draft
          gh release edit "$TAG" --draft=false
